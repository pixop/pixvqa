# PixVQA learned-metric configuration for cvvdp, cvqa-hdr-nr, and simplevqa. The same
# interpreter (see [learned].python) satisfies CVVDP, NR, and SimpleVQA deps.
#
# Copy to config/learned_metrics.local.toml (ignored by Git) and edit the paths.
# PixVQA reads it when cvvdp, cvqa-hdr-nr, or simplevqa is selected. Lookup order:
#   1. --learned-config PATH
#   2. PIXVQA_LEARNED_CONFIG=PATH  (PIXVQA_LEARNED_CONFIG=none disables lookup)
#   3. config/learned_metrics.local.toml in the checkout that holds the
#      executable (bin/pixvqa or build/<kind>/pixvqa)
#
# Precedence for every value: command-line option, then environment variable
# (PIXVQA_CVVDP_PYTHON, PIXVQA_CVQAHDR_PYTHON, PIXVQA_SIMPLEVQA_PYTHON), then the metric section, then
# [learned], then the built-in default.
#
# Values are quoted strings. "~/" expands to $HOME. Relative paths are relative
# to this file's directory. A value without "/" is a command looked up on PATH.
# See docs/LEARNED_METRICS.md.

[learned]
# One interpreter for cvvdp, cvqa-hdr-nr, and SimpleVQA deps (docs/LEARNED_METRICS.md).
# Relative to this file's directory (.. is the repository root). Expand to an
# absolute path in learned_metrics.local.toml if you prefer.
python = "../.venv/bin/python"
# Directory holding the pixvqa_cvvdp and pixvqa_cvqahdr adapter packages.
# Appended to PYTHONPATH, so an explicit PYTHONPATH still wins.
adapter_path = "../python"
# Prepended to PATH for the backends. CVVDP decodes with ffmpeg and ffprobe.
path = "~/bin"

[cvvdp]
# Optional. Default: the cvvdp entry point beside the interpreter, then PATH.
# executable = "../.venv/bin/cvvdp"
# Optional per-metric interpreter; overrides [learned] python.
# python = "../.venv/bin/python"

[cvqa-hdr-nr]
# Optional defaults beside the binary checkout: deps/CompressedVQA-HDR,
# deps/CompressedVQA-HDR/NR_HDR_VQA.pth, deps/CompressedVQA-HDR/NR_HDR_VQA.npy
repository = "~/src/CompressedVQA-HDR"
checkpoint = "~/models/compressedvqa-hdr/NR_HDR_VQA.pth"
profile = "~/models/compressedvqa-hdr/NR_HDR_VQA.npy"
# python = "../.venv/bin/python"

[simplevqa]
# Upstream SimpleVQA checkout and official UGC checkpoint (see docs/dev/SIMPLEVQA_REFERENCE.md).
# repository = "../deps/SimpleVQA"
# checkpoint = "../deps/SimpleVQA/ckpts/UGC_BVQA_model.pth"
# python = "../.venv/bin/python"

[hdr-chipqa]
# Unified SDR + PQ HDR (+ experimental HLG) NR via deps/hdr_chipqa (see docs/dev/CHIPQA_REFERENCE.md).
# feature_python and inference_python may differ (sklearn 1.0.2 on Python 3.10 for SVR).
# repository = "../deps/hdr_chipqa"
# feature_python = "../.venv/bin/python"
# inference_python = "~/.venvs/pixvqa-chipqa-ref/bin/python"
